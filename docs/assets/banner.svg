<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">vbx — quick VirtualBox control</title>
  <desc id="desc">A compact terminal-inspired wordmark for vbox-tui.</desc>
  <rect width="960" height="260" rx="24" fill="#111827"/>
  <rect x="36" y="36" width="64" height="64" rx="16" fill="#1f2937"/>
  <path d="m54 55 14 13-14 13m22 0h10" fill="none" stroke="#67e8f9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="124" y="92" fill="#f8fafc" font-family="ui-monospace,Consolas,monospace" font-size="66" font-weight="700">vbx</text>
  <text x="38" y="153" fill="#e2e8f0" font-family="system-ui,Segoe UI,sans-serif" font-size="29">Quick VirtualBox control. Right from your terminal.</text>
  <text x="40" y="207" fill="#67e8f9" font-family="ui-monospace,Consolas,monospace" font-size="19">pick  →  act  →  back to your shell</text>
  <text x="806" y="224" fill="#94a3b8" font-family="ui-monospace,Consolas,monospace" font-size="16">vbox-tui</text>
</svg>
